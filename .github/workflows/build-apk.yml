name: Build KeyOS APK

on:
  workflow_dispatch:
    inputs:
      gboard_url:
        description: HTTPS URL of a compatible arm64-v8a Gboard APK
        required: true
        type: string
      gboard_sha256:
        description: Optional SHA-256 checksum for the downloaded APK
        required: false
        type: string
      release_tag:
        description: Git tag for the GitHub Release, for example v1.3.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Patch Gboard into KeyOS APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download stock Gboard APK
        env:
          GBOARD_URL: ${{ inputs.gboard_url }}
        run: |
          case "$GBOARD_URL" in
            https://*) ;;
            *) echo "gboard_url must use HTTPS" >&2; exit 1 ;;
          esac
          mkdir -p input
          curl --fail --location --retry 3 --output input/gboard.apk "$GBOARD_URL"
          test -s input/gboard.apk

      - name: Verify Gboard checksum
        if: ${{ inputs.gboard_sha256 != '' }}
        env:
          EXPECTED_SHA256: ${{ inputs.gboard_sha256 }}
        run: |
          echo "$EXPECTED_SHA256  input/gboard.apk" | sha256sum --check --strict

      - name: Build KeyOS APK
        run: |
          chmod +x build.sh
          ./build.sh input/gboard.apk

      - name: Validate generated APK
        run: |
          test -s output/KeyOS.apk
          file output/KeyOS.apk
          unzip -tq output/KeyOS.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: keyos-apk
          path: output/KeyOS.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: KeyOS ${{ inputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          files: output/KeyOS.apk
